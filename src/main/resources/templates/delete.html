<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo削除確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">ToDo削除確認</h1>
        <div class="form-row">
            <div class="form-label">やること</div>
            <p class="confirm-value" th:text="${todo.title}">やること</p>
        </div>
        <div class="form-row">
            <div class="form-label">ジャンル</div>
            <p class="confirm-value" th:text="${todo.category}">ジャンル</p>
        </div>
        <div class="form-row">
            <div class="form-label">期限</div>
            <p class="confirm-value" th:text="${todo.dueDate}">期限</p>
        </div>
        <div class="confirm-actions">
            <form th:action="@{/todos/{id}/delete(id=${id})}" method="post">
                <button class="btn" type="submit">消す</button>
            </form>
            <a class="btn sub" th:href="@{/todos}">やめる</a>
        </div>
    </div>
</body>
</html>
