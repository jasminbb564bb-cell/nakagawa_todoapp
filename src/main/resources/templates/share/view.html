<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共有Todo</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="container">
    <h1 class="page-title">共有Todo</h1>
    <dl>
        <dt>やること</dt><dd th:text="${todo.title}">やること</dd>
        <dt>メモ</dt><dd th:text="${todo.detail}">メモ</dd>
        <dt>ジャンル</dt><dd th:text="${todo.category}">ジャンル</dd>
        <dt>優先度</dt><dd th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">優先度</dd>
        <dt>期限</dt><dd th:text="${todo.dueDate}">期限</dd>
        <dt>状態</dt><dd th:text="${todo.completed ? '完了' : '未完了'}">状態</dd>
        <dt>共有リンクの有効期限</dt><dd th:text="${#temporals.format(expiresAt, 'yyyy-MM-dd HH:mm')}">有効期限</dd>
    </dl>
</main>
</body>
</html>
