<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container calendar-page" th:classappend="${isWeekView} ? ' week-view' : ''">
        <div class="calendar-header" th:classappend="${isWeekView} ? ' week-view-header' : ''">
            <div class="calendar-header-left">
                <a class="btn sub" th:if="${isWeekView}" th:href="@{/calendar(view='week',from=${previousFrom})}">前の週</a>
                <a class="btn sub" th:unless="${isWeekView}" th:href="@{/calendar(year=${previousYear},month=${previousMonth})}">前の月</a>
                <a class="btn sub" th:if="${isWeekView}" th:href="@{/calendar(view='week',from=${nextFrom})}">次の週</a>
                <a class="btn sub" th:unless="${isWeekView}" th:href="@{/calendar(year=${nextYear},month=${nextMonth})}">次の月</a>
            </div>
            <h1 class="page-title" th:text="${monthTitle}">2026年4月</h1>
            <div class="calendar-header-right">
                <a class="btn sub" th:href="@{/todos}">表で見る</a>
                <a class="btn sub" th:href="@{/todos/new}">新規登録</a>
                <a class="btn sub" th:if="${isWeekView}" th:href="@{/calendar(year=${year},month=${month})}">月表示</a>
                <a class="btn sub" th:unless="${isWeekView}" th:href="@{/calendar(view='week',from=${from})}">週表示</a>
            </div>
        </div>

        <table class="calendar-table" th:attr="data-from=${from},data-to=${to}">
            <thead>
                <tr>
                    <th scope="col">日</th>
                    <th scope="col">月</th>
                    <th scope="col">火</th>
                    <th scope="col">水</th>
                    <th scope="col">木</th>
                    <th scope="col">金</th>
                    <th scope="col">土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="week : ${weeks}">
                    <td th:each="day : ${week}" th:attr="data-date=${day.date}" th:classappend="${isWeekView} ? ' week-day' : ''">
                        <span th:if="${day.date != null}" th:text="${day.date.dayOfMonth}">1</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
    <script>
        const isWeekView = () => document.querySelector('main').classList.contains('week-view');

        function getCalendarCellArea(cell, className) {
            let area = cell.querySelector(`.${className}`);
            if (area) return area;
            area = document.createElement('div');
            area.className = className;
            const date = cell.querySelector('span');
            if (className === 'calendar-weather-area') {
                date.insertAdjacentElement('afterend', area);
            } else {
                const weatherArea = cell.querySelector('.calendar-weather-area');
                (weatherArea || date).insertAdjacentElement('afterend', area);
            }
            return area;
        }

        function weatherMark(weatherText) {
            const marks = {
                '晴': '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/>',
                '曇': '<path d="M6 18h11a4 4 0 0 0 .5-8A5.5 5.5 0 0 0 7 8.5 4.5 4.5 0 0 0 6 18Z"/>',
                '雨': '<path d="M6 14h11a4 4 0 0 0 .5-8A5.5 5.5 0 0 0 7 4.5 4.5 4.5 0 0 0 6 14Z"/><path d="m8 17-1 3M13 17l-1 3M18 17l-1 3"/>',
                '雷雨': '<path d="M6 12h11a4 4 0 0 0 .5-8A5.5 5.5 0 0 0 7 2.5 4.5 4.5 0 0 0 6 12Z"/><path d="m13 12-3 5h3l-2 5 6-7h-3l2-3"/>',
                '雪': '<path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/><path d="M12 3l-1.5 2M12 3l1.5 2M12 21l-1.5-2M12 21l1.5-2"/>'
            };
            const body = marks[weatherText] || marks['曇'];
            return `<svg class="weather-mark" viewBox="0 0 24 24" role="img" aria-label="${weatherText}" focusable="false"><title>${weatherText}</title><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter">${body}</g></svg>`;
        }

        async function loadTodosIntoCalendar() {
            const calendarTable = document.querySelector('.calendar-table');
            const from = calendarTable.dataset.from;
            const to = calendarTable.dataset.to;
            const res = await fetch(`/api/todos?from=${from}&to=${to}`);
            const todos = await res.json();

            const cells = document.querySelectorAll('td[data-date]');
            const todosByDate = {};
            todos.forEach(todo => {
                if (!todosByDate[todo.dueDate]) todosByDate[todo.dueDate] = [];
                todosByDate[todo.dueDate].push(todo);
            });

            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            cells.forEach(cell => {
                const dateTodos = todosByDate[cell.dataset.date] || [];
                const visibleTodos = isWeekView() ? dateTodos : dateTodos.slice(0, 3);
                const todoArea = getCalendarCellArea(cell, 'calendar-todo-area');
                visibleTodos.forEach(todo => {
                    const todoName = document.createElement('a');
                    todoName.href = `/todos/${todo.id}/edit`;
                    todoName.textContent = todo.title;
                    todoName.className = 'calendar-todo-link';
                    if (todo.dueDate < today && !todo.completed) {
                        todoName.style.color = 'red';
                    }
                    todoArea.appendChild(todoName);
                });
                if (!isWeekView() && dateTodos.length > 3) {
                    const otherTodos = document.createElement('div');
                    otherTodos.textContent = `ほか ${dateTodos.length - 3}件`;
                    todoArea.appendChild(otherTodos);
                }
            });
        }

        async function loadHolidaysIntoCalendar() {
            const calendarTable = document.querySelector('.calendar-table');
            const from = calendarTable.dataset.from;
            const to = calendarTable.dataset.to;
            const res = await fetch(`/api/holidays?from=${from}&to=${to}`);
            const holidays = await res.json();

            if (res.headers.has('X-Holidays-Unavailable')) {
                const notice = document.createElement('p');
                notice.textContent = '祝日を取れませんでした';
                document.querySelector('main').prepend(notice);
            }

            const style = document.createElement('style');
            style.textContent = `
                .calendar-table td.saturday > span { color: #456d91; }
                .calendar-table td.sunday > span { color: #b35a5a; }
                .calendar-table td.holiday > span { color: #ff651f; }
            `;
            document.head.appendChild(style);

            const cells = document.querySelectorAll('td[data-date]');
            cells.forEach(cell => {
                const date = new Date(`${cell.dataset.date}T00:00:00`);
                if (date.getDay() === 6) cell.classList.add('saturday');
                if (date.getDay() === 0) cell.classList.add('sunday');
                if (holidays[cell.dataset.date]) {
                    cell.classList.add('holiday');
                    cell.title = holidays[cell.dataset.date];
                }
            });
        }

        async function loadWeatherIntoCalendar() {
            const calendarTable = document.querySelector('.calendar-table');
            const cells = document.querySelectorAll('td[data-date]');
            try {
                const res = await fetch(`/api/weather?from=${calendarTable.dataset.from}&to=${calendarTable.dataset.to}`);
                if (!res.ok) return;
                const weather = await res.json();
                cells.forEach(cell => {
                    if (weather[cell.dataset.date]) {
                        const weatherLabel = document.createElement('div');
                        weatherLabel.className = 'calendar-weather';
                        weatherLabel.innerHTML = weatherMark(weather[cell.dataset.date]);
                        getCalendarCellArea(cell, 'calendar-weather-area').appendChild(weatherLabel);
                    }
                });
            } catch (error) {
                // 天気が取れなくても、既に表示しているカレンダーはそのまま残す
            }
        }

        loadTodosIntoCalendar();
        loadHolidaysIntoCalendar();
        loadWeatherIntoCalendar();
    </script>
</body>
</html>
