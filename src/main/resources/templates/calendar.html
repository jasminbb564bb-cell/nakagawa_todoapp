<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container calendar-page">
        <div class="calendar-header">
            <a class="btn sub" th:href="@{/calendar(year=${previousYear},month=${previousMonth})}">前の月</a>
            <h1 class="page-title" th:text="${monthTitle}">2026年4月</h1>
            <a class="btn sub" th:href="@{/calendar(year=${nextYear},month=${nextMonth})}">次の月</a>
        </div>

        <table class="calendar-table" th:attr="data-from=${from},data-to=${to}">
            <thead>
                <tr>
                    <th scope="col">日</th>
                    <th scope="col">月</th>
                    <th scope="col">火</th>
                    <th scope="col">水</th>
                    <th scope="col">木</th>
                    <th scope="col">金</th>
                    <th scope="col">土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="week : ${weeks}">
                    <td th:each="day : ${week}" th:attr="data-date=${day.date}">
                        <span th:if="${day.date != null}" th:text="${day.date.dayOfMonth}">1</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
    <script>
        async function loadTodosIntoCalendar() {
            const calendarTable = document.querySelector('.calendar-table');
            const from = calendarTable.dataset.from;
            const to = calendarTable.dataset.to;
            const res = await fetch(`/api/todos?from=${from}&to=${to}`);
            const todos = await res.json();

            const cells = document.querySelectorAll('td[data-date]');
            todos.forEach(todo => {
                cells.forEach(cell => {
                    if (cell.dataset.date === todo.dueDate) {
                        const todoName = document.createElement('div');
                        todoName.textContent = todo.title;
                        cell.appendChild(todoName);
                    }
                });
            });
        }

        loadTodosIntoCalendar();
    </script>
</body>
</html>
